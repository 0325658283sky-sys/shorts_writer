<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Cut — 생성 중</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#16161A; --accent:#4B3BFF;
    --radius:11px; --radius-control:8px; --radius-pill:999px;
    --font: 'Pretendard','Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);font-family:var(--font);color:#fff}
  button{font-family:inherit;cursor:pointer;border:none}

  .app{width:1440px;max-width:100%;height:900px;background:var(--ink);display:flex;align-items:center;justify-content:center}

  .panel{width:520px;background:#1a1a21;border:1px solid #26262f;border-radius:var(--radius);padding:36px;display:flex;flex-direction:column;gap:22px}

  .kicker{font-size:11px;font-weight:700;letter-spacing:.09em;color:#8b8b98;text-transform:uppercase}
  .headline{font-size:20px;font-weight:800;margin-top:8px}

  /* TODO(coding AI): 이 4단계는 실제 백엔드 작업 상태와 폴링/웹소켓으로 동기화되어야 함.
     각 <li>의 data-status는 done | active | pending 중 하나로 서버 상태에 맞춰 갱신. */
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
  .step{display:flex;align-items:center;gap:12px}
  .step[data-status="pending"]{opacity:.45}
  .step-icon{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .step[data-status="done"] .step-icon{background:#0F7B52}
  .step[data-status="active"] .step-icon{background:var(--accent)}
  .step[data-status="pending"] .step-icon{background:none;border:1.5px solid #3a3a45}
  .step-label{font-size:13.5px;flex-grow:1}
  .step[data-status="done"] .step-label,
  .step[data-status="pending"] .step-label{font-weight:600}
  .step[data-status="active"] .step-label{font-weight:700}
  .step-time{font-size:11px;color:#63636f}

  .progress-track{width:100%;height:6px;border-radius:var(--radius-pill);background:#26262f;overflow:hidden}
  .progress-fill{height:100%;background:var(--accent)}
  .progress-caption{font-size:11.5px;color:#8b8b98;margin-top:8px}

  .found-segment{background:#1f1f27;border:1px solid #2b2b35;border-radius:var(--radius-control);padding:14px}
  .found-segment .label{font-size:10.5px;font-weight:700;color:var(--accent);letter-spacing:.03em;margin-bottom:6px}
  .found-segment .text{font-size:12.5px;font-weight:600;color:#e6e6ea}

  .btn-ghost{background:transparent;border:1px solid #34343f;border-radius:var(--radius-control);padding:12px;font-size:12.5px;font-weight:600;color:#b8b8c2;width:100%}
</style>
</head>
<body>
<div class="app">

  <section class="panel" role="status" aria-live="polite">

    <div>
      <div class="kicker">쇼츠 만드는 중</div>
      <!-- TODO(coding AI): 헤드라인 텍스트는 현재 active 단계에 맞춰 갱신 -->
      <h1 class="headline" id="progress-headline" style="margin:0">하이라이트 구간을 찾고 있어요</h1>
    </div>

    <ol class="steps" id="progress-steps">
      <li class="step" data-status="done" data-step="fetch">
        <span class="step-icon"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></span>
        <span class="step-label">원본 영상 가져오기</span>
        <span class="step-time">12초</span>
      </li>
      <li class="step" data-status="done" data-step="transcribe">
        <span class="step-icon"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></span>
        <span class="step-label">말소리 받아쓰기 · 2,410단어</span>
        <span class="step-time">48초</span>
      </li>
      <li class="step" data-status="active" data-step="highlight">
        <span class="step-icon"></span>
        <span class="step-label">볼 만한 구간 고르는 중</span>
        <span class="step-time"></span>
      </li>
      <li class="step" data-status="pending" data-step="template">
        <span class="step-icon"></span>
        <span class="step-label">템플릿 적용해서 자막 붙이기</span>
      </li>
    </ol>

    <div>
      <!-- TODO(coding AI): width(%)와 캡션의 경과/잔여 시간을 실제 작업 진행률로 바인딩 -->
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:52%"></div></div>
      <div class="progress-caption" id="progress-caption">1분 12초 지남 · 약 40초 남음</div>
    </div>

    <!-- TODO(coding AI): 첫 하이라이트 구간이 감지되는 즉시 표시(그 전엔 숨김) -->
    <div class="found-segment" id="found-segment">
      <div class="label">먼저 찾은 구간</div>
      <div class="text">"애들레이드에서 말차에 꽂히고 있다면?" — 03:12부터 28초</div>
    </div>

    <!-- TODO(coding AI): 이 화면을 벗어나도(닫아도) 서버 작업은 계속 진행되어야 함.
         완료 시 알림/리다이렉트로 04-results.html 로 이동 -->
    <button class="btn-ghost" id="btn-close-keep-running" type="button">닫아도 계속 만듭니다</button>
  </section>
</div>
</body>
</html>
